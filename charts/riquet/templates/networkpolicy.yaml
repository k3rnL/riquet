{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "riquet.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "riquet.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - {port: 8081, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              {{- include "riquet.selectorLabels" . | nindent 14 }}
      ports:
        - {port: 8083, protocol: TCP}
{{- end }}
