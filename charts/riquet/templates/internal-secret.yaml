{{- if and (eq .Values.storage.backend "kafka") (not .Values.auth.internalTokenSecret.name) -}}
{{- $secretName := include "riquet.internalTokenSecretName" . -}}
{{- $secretKey := .Values.auth.internalTokenSecret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := randAlphaNum 64 | b64enc -}}
{{- if and $existing $existing.data (hasKey $existing.data $secretKey) -}}
{{- $token = index $existing.data $secretKey -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "riquet.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $secretKey }}: {{ $token | quote }}
{{- end }}
