replicaCount: 1

image:
  repository: ghcr.io/k3rnl/riquet
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

storage:
  backend: pvc
  pvc:
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  kafka:
    brokers: []
    topic: _riquet_state
    transactionalId: riquet-registry
    groupId: riquet-registry-primary
    replicationFactor: 3
    autoCreateTopic: false
    maxReadyLag: 0
    tls:
      enabled: false
      secretName: ""
      caKey: ca.crt
      certKey: tls.crt
      keyKey: tls.key
      serverName: ""
    sasl:
      mechanism: ""
      secretName: ""
      usernameKey: username
      passwordKey: password

auth:
  mode: anonymous
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  bearerTokenKey: bearer-token
  adminTokenKey: admin-token
  internalTokenSecret:
    # Leave empty to let the chart generate and preserve an internal token.
    name: ""
    key: internal-token

service:
  type: ClusterIP
  port: 8081
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: riquet.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
